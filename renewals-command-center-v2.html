<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Renewals Command Center</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --overdue:#b91c1c; --overdue-bg:#fef2f2;
    --c30:#c2410c;  --c30-bg:#fff7ed;
    --c60:#a16207;  --c60-bg:#fefce8;
    --c90:#1d4ed8;  --c90-bg:#eff6ff;
    --far:#475569;  --far-bg:#f1f5f9;
    --ok:#047857;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:18px}
  .wrap{max-width:1400px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;
         padding:8px 14px;color:var(--ink);transition:.12s}
  button:hover{border-color:#cbd5e1;background:#f8fafc}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:550}
  button.primary:hover{background:#1e293b}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--line))}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.055em;color:var(--muted);font-weight:600}
  .kpi .val{font-size:25px;font-weight:660;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .sub2{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h2{font-size:13px;font-weight:640;margin:0 0 3px;letter-spacing:-.005em}
  .panel .note{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .chartbox{height:210px;position:relative}

  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .chip{border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:550;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
  input[type=search]{flex:1;min-width:210px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  input[type=search]:focus{outline:none;border-color:#94a3b8}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.055em;color:var(--muted);
     font-weight:640;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
  th:hover{color:var(--ink)}
  th .ar{opacity:.45;font-size:9px;margin-left:3px}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:#f8fafc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .nm{font-weight:560}
  .pn{font-size:11.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:620;white-space:nowrap}
  .b-overdue{background:var(--overdue-bg);color:var(--overdue)}
  .b-30{background:var(--c30-bg);color:var(--c30)}
  .b-60{background:var(--c60-bg);color:var(--c60)}
  .b-90{background:var(--c90-bg);color:var(--c90)}
  .b-far{background:var(--far-bg);color:var(--far)}
  .b-prog{background:#ecfdf5;color:var(--ok)}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .err{background:var(--overdue-bg);border:1px solid #fecaca;color:#991b1b;padding:12px 14px;border-radius:9px;margin-bottom:14px;font-size:13px}
  .tblwrap{max-height:520px;overflow:auto}
  .foot{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Renewals Command Center</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="primary" id="refresh">Refresh</button>
  </header>

  <div id="err"></div>
  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <h2>Expiry curve — next 12 months</h2>
    <div class="note">Policies reaching <em>Period To</em>, by month. Shows the workload before it arrives.</div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Renewal book</h2>
    <div class="note">Derived live from Policy Entry — independent of whether the nightly schedule has created a Renewals record yet.</div>
    <div class="toolbar" id="chips"></div>
    <div class="toolbar"><input type="search" id="q" placeholder="Search name, policy number, insurer, type…"/></div>
    <div class="tblwrap"><table>
      <thead><tr id="hrow"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- config ---------- */
var APP_OWNER = "mohammadhamza383";
var APP_NAME  = "inspt-policy-accounting-system";
var POLICY_REPORT   = "All_Policy_Entries";
var RENEWALS_REPORT = "Renewals_Report";
// Click-through target. Creator exposes no deep-linkable record-EDIT url, so we open the
// report and let its own search land on the record. Kept as one function so it is trivial
// to repoint once the exact behaviour is confirmed live.
function recordUrl(r){
  return "https://creatorapp.zoho.com/"+APP_OWNER+"/"+APP_NAME+"/#Report:"+POLICY_REPORT
         +"?Policy_Number="+encodeURIComponent(r.policyNo||"");
}

var BUCKETS = [
  {key:"overdue", label:"Overdue",      cls:"b-overdue", accent:"var(--overdue)", test:function(d){return d < 0;}},
  {key:"d30",     label:"≤ 30 days",    cls:"b-30",      accent:"var(--c30)",     test:function(d){return d >= 0  && d <= 30;}},
  {key:"d60",     label:"31–60 days",   cls:"b-60",      accent:"var(--c60)",     test:function(d){return d >= 31 && d <= 60;}},
  {key:"d90",     label:"61–90 days",   cls:"b-90",      accent:"var(--c90)",     test:function(d){return d >= 61 && d <= 90;}},
  {key:"d180",    label:"3–6 months",   cls:"b-far",     accent:"var(--far)",     test:function(d){return d >= 91 && d <= 180;}},
  {key:"d365",    label:"6–12 months",  cls:"b-far",     accent:"var(--far)",     test:function(d){return d >= 181 && d <= 365;}}
];

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var state = { rows:[], filter:"all", q:"", sort:"days", dir:1, chart:null };

/* ---------- helpers ---------- */
function dv(v){ if(v && typeof v === "object") return v.display_value==null ? "" : String(v.display_value);
                return v==null ? "" : String(v); }
function num(v){ var n = parseFloat(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?0:n; }
function parseDate(s){
  if(!s) return null;
  var m = String(s).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
  if(!m) return null;
  var mo = MONTHS.indexOf(m[2].charAt(0).toUpperCase()+m[2].slice(1,3).toLowerCase());
  if(mo < 0) return null;
  return new Date(Date.UTC(+m[3], mo, +m[1]));
}
function today(){ var n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function fmtDate(d){ return d ? String(d.getUTCDate()).padStart(2,"0")+"-"+MONTHS[d.getUTCMonth()]+"-"+d.getUTCFullYear() : "—"; }
function fmtOMR(n){ return n.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function bucketOf(days){
  for(var i=0;i<BUCKETS.length;i++){ if(BUCKETS[i].test(days)) return BUCKETS[i]; }
  return null; // beyond 12 months — out of scope
}

/* ---------- data ---------- */
// Matches the pattern proven in the v1 widget: report_name + max_records, paginated via
// record_cursor (NOT a page number — Creator's SDK returns a cursor to pass back), and
// treating Zoho's 9220 (empty report) as an empty array rather than an error.
async function fetchAll(reportName){
  var out = [], cursor = null, guard = 0;
  while(guard++ < 60){
    var cfg = { report_name: reportName, max_records: 200 };
    if(cursor) cfg.record_cursor = cursor;
    var res;
    try {
      res = await ZOHO.CREATOR.DATA.getRecords(cfg);
    } catch(e){
      var code = e && (e.code || (e.responseText && e.responseText.code));
      if(code == 9220) return out;               // empty report is a valid state, not a failure
      throw e;
    }
    var data = (res && res.data) ? res.data : [];
    out = out.concat(data);
    cursor = res && res.record_cursor;
    if(!cursor || data.length === 0) break;
  }
  return out;
}

function load(){
  document.getElementById("err").innerHTML = "";
  document.getElementById("sub").textContent = "Loading…";
  return ZOHO.CREATOR.init()
    .then(function(){ return Promise.all([ fetchAll(POLICY_REPORT), fetchAll(RENEWALS_REPORT) ]); })
    .then(function(res){ build(res[0]||[], res[1]||[]); })
    .catch(function(e){
      document.getElementById("err").innerHTML =
        '<div class="err"><strong>Could not load data.</strong> '+esc(e && (e.message||e.code||JSON.stringify(e)))+'</div>';
      document.getElementById("sub").textContent = "Load failed";
    });
}

function build(policies, renewals){
  var t = today();

  // Map existing Renewals records by the policy they track, so in-progress work is visible.
  var inProgress = {};
  renewals.forEach(function(r){
    var link = dv(r.Original_Policy) || dv(r.Policy_Number);
    var st   = dv(r.Renewal_Status);
    if(link) inProgress[link.trim()] = st || "Pending";
  });

  var rows = [];
  policies.forEach(function(p){
    var pt = parseDate(p.Period_To);
    if(!pt) return;                                   // 3 records have no Period To — excluded, surfaced in footer
    if(dv(p.Dropdown1) === "Cancelled") return;       // cancelled policies are not renewable
    var days = Math.round((pt - t) / 86400000);
    var b = bucketOf(days);
    if(!b) return;                                    // beyond 12 months
    var name = dv(p.Insured_Name).trim();
    var pn   = dv(p.Policy_Number).trim();
    rows.push({
      id: dv(p.ID), name: name || "(no name)", policyNo: pn,
      insurer: dv(p.Insurers), type: dv(p.Insurance_Types),
      expiry: pt, days: days, bucket: b,
      premium: num(p.Premium), commission: num(p.Commission),
      status: inProgress[pn] || inProgress[dv(p.ID)] || ""
    });
  });

  state.rows = rows;
  state.noPeriodTo = policies.filter(function(p){ return !parseDate(p.Period_To); }).length;
  state.totalPolicies = policies.length;
  render();
}

/* ---------- render ---------- */
function counts(){
  var c = {all: state.rows.length};
  BUCKETS.forEach(function(b){ c[b.key] = 0; });
  state.rows.forEach(function(r){ c[r.bucket.key]++; });
  return c;
}

function renderKpis(){
  var c = counts(), r = state.rows;
  var sum = function(f){ return r.filter(f).reduce(function(a,x){ return a + x.commission; }, 0); };
  var at90 = sum(function(x){ return x.days >= 0 && x.days <= 90; });
  var overdueComm = sum(function(x){ return x.days < 0; });
  var next12 = r.filter(function(x){ return x.days >= 0; }).length;

  var cards = [
    {lbl:"Overdue",        val:c.overdue, sub:fmtOMR(overdueComm)+" OMR commission", accent:"var(--overdue)"},
    {lbl:"Due ≤ 30 days",  val:c.d30,     sub:"immediate action",                    accent:"var(--c30)"},
    {lbl:"Due 31–60 days", val:c.d60,     sub:"quoting window",                      accent:"var(--c60)"},
    {lbl:"Due 61–90 days", val:c.d90,     sub:"early engagement",                    accent:"var(--c90)"},
    {lbl:"Next 12 months", val:next12,    sub:"total renewable book",                accent:"var(--far)"},
    {lbl:"Commission at risk", val:fmtOMR(at90), sub:"expiring within 90 days",      accent:"var(--ok)"}
  ];
  document.getElementById("kpis").innerHTML = cards.map(function(k){
    return '<div class="kpi" style="--accent:'+k.accent+'">'
         + '<div class="lbl">'+esc(k.lbl)+'</div>'
         + '<div class="val">'+esc(k.val)+'</div>'
         + '<div class="sub2">'+esc(k.sub)+'</div></div>';
  }).join("");
}

function renderChart(){
  var t = today(), buckets = {}, labels = [], data = [], colors = [];
  for(var i=0;i<12;i++){
    var d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+i, 1));
    var k = d.getUTCFullYear()+"-"+d.getUTCMonth();
    buckets[k] = 0;
    labels.push(MONTHS[d.getUTCMonth()] + (d.getUTCMonth()===0 || i===0 ? " " + String(d.getUTCFullYear()).slice(2) : ""));
  }
  state.rows.forEach(function(r){
    if(r.days < 0) return;
    var k = r.expiry.getUTCFullYear()+"-"+r.expiry.getUTCMonth();
    if(k in buckets) buckets[k]++;
  });
  Object.keys(buckets).forEach(function(k, i){
    data.push(buckets[k]);
    colors.push(i===0 ? "#c2410c" : i===1 ? "#a16207" : i===2 ? "#1d4ed8" : "#94a3b8");
  });
  if(state.chart) state.chart.destroy();
  var ctx = document.getElementById("chart").getContext("2d");
  state.chart = new Chart(ctx, {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:colors, borderRadius:5, maxBarThickness:46 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(c){ return c.parsed.y + " polic" + (c.parsed.y===1?"y":"ies") + " expiring"; } } } },
      scales:{
        x:{ grid:{display:false}, ticks:{ font:{size:11}, color:"#64748b" } },
        y:{ beginAtZero:true, grid:{ color:"#f1f5f9" }, ticks:{ precision:0, font:{size:11}, color:"#64748b" } }
      }
    }
  });
}

function renderChips(){
  var c = counts();
  var items = [{key:"all", label:"All"}].concat(BUCKETS);
  document.getElementById("chips").innerHTML = items.map(function(b){
    return '<button class="chip'+(state.filter===b.key?" on":"")+'" data-k="'+b.key+'">'
         + esc(b.label)+'<span class="n">'+(c[b.key]||0)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(el){
    el.onclick = function(){ state.filter = el.getAttribute("data-k"); render(); };
  });
}

var COLS = [
  {k:"name",       t:"Insured",     cls:""},
  {k:"insurer",    t:"Insurer",     cls:""},
  {k:"type",       t:"Type",        cls:""},
  {k:"expiry",     t:"Expires",     cls:""},
  {k:"days",       t:"Days left",   cls:"num"},
  {k:"premium",    t:"Premium",     cls:"num"},
  {k:"commission", t:"Commission",  cls:"num"},
  {k:"status",     t:"Renewal",     cls:""}
];

function renderTable(){
  document.getElementById("hrow").innerHTML = COLS.map(function(c){
    var ar = state.sort===c.k ? '<span class="ar">'+(state.dir>0?"▲":"▼")+"</span>" : "";
    return '<th class="'+c.cls+'" data-k="'+c.k+'">'+esc(c.t)+ar+"</th>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"), function(th){
    th.onclick = function(){
      var k = th.getAttribute("data-k");
      if(state.sort===k) state.dir = -state.dir; else { state.sort=k; state.dir=1; }
      render();
    };
  });

  var q = state.q.trim().toLowerCase();
  var list = state.rows.filter(function(r){
    if(state.filter!=="all" && r.bucket.key!==state.filter) return false;
    if(!q) return true;
    return (r.name+" "+r.policyNo+" "+r.insurer+" "+r.type).toLowerCase().indexOf(q) >= 0;
  });
  list.sort(function(a,b){
    var k = state.sort, x = a[k], y = b[k];
    if(k==="expiry"){ x = a.expiry.getTime(); y = b.expiry.getTime(); }
    if(typeof x === "string"){ return x.localeCompare(y) * state.dir; }
    return (x - y) * state.dir;
  });

  var tb = document.getElementById("rows");
  if(!list.length){
    tb.innerHTML = '<tr><td colspan="'+COLS.length+'"><div class="empty">No policies match this view.</div></td></tr>';
  } else {
    tb.innerHTML = list.map(function(r){
      var dtxt = r.days < 0 ? Math.abs(r.days)+"d ago" : r.days+"d";
      var st = r.status
        ? '<span class="pill b-prog">'+esc(r.status)+"</span>"
        : (r.days < 0 ? '<span class="pill b-overdue">Never actioned</span>' : '<span style="color:var(--muted)">—</span>');
      return '<tr data-pn="'+esc(r.policyNo)+'">'
        + '<td><div class="nm">'+esc(r.name)+'</div><div class="pn">'+esc(r.policyNo||"no policy number")+"</div></td>"
        + "<td>"+esc(r.insurer||"—")+"</td>"
        + "<td>"+esc(r.type||"—")+"</td>"
        + "<td>"+fmtDate(r.expiry)+"</td>"
        + '<td class="num"><span class="pill '+r.bucket.cls+'">'+dtxt+"</span></td>"
        + '<td class="num">'+fmtOMR(r.premium)+"</td>"
        + '<td class="num">'+fmtOMR(r.commission)+"</td>"
        + "<td>"+st+"</td></tr>";
    }).join("");
    Array.prototype.forEach.call(tb.querySelectorAll("tr[data-pn]"), function(tr){
      tr.onclick = function(){
        var pn = tr.getAttribute("data-pn");
        var row = state.rows.filter(function(r){ return r.policyNo === pn; })[0];
        if(row) window.open(recordUrl(row), "_blank");
      };
    });
  }

  var c = counts();
  document.getElementById("foot").innerHTML =
    "Showing <strong>"+list.length+"</strong> of "+state.rows.length+" policies expiring within 12 months, "
    + "out of "+state.totalPolicies+" total. Cancelled policies excluded"
    + (state.noPeriodTo ? "; <strong>"+state.noPeriodTo+"</strong> record(s) have no Period To and cannot be tracked" : "")
    + ". Click any row to open it in Creator.";
  document.getElementById("sub").textContent =
    c.overdue+" overdue · "+c.d30+" due within 30 days · "+c.d60+" in 31–60 · "+c.d90+" in 61–90";
}

function render(){ renderKpis(); renderChart(); renderChips(); renderTable(); }

document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; renderTable(); });
document.getElementById("refresh").addEventListener("click", boot);

function showError(msg){
  document.getElementById("err").innerHTML = '<div class="err"><strong>Could not load data.</strong> '+esc(msg)+'</div>';
  document.getElementById("sub").textContent = "Load failed";
}

// The widget SDK script loads asynchronously — calling ZOHO.CREATOR.init() at parse time
// throws before any promise exists, which leaves the page stuck on "Loading…" forever with
// no visible error (the widget is cross-origin, so its console is not observable from the
// host page either). Wait for both the DOM and the SDK, and always fail loudly.
function boot(){
  var tries = 0;
  (function poll(){
    if(window.ZOHO && ZOHO.CREATOR && typeof ZOHO.CREATOR.init === "function"){
      var done = false;
      var timer = setTimeout(function(){
        if(!done) showError("Timed out after 45s waiting for Zoho Creator data.");
      }, 45000);
      load().then(function(){ done = true; clearTimeout(timer); })
            .catch(function(e){ done = true; clearTimeout(timer);
                                showError(e && (e.message || e.code || JSON.stringify(e))); });
      return;
    }
    if(tries++ > 150){ showError("Zoho Creator widget SDK did not load after 15s."); return; }
    setTimeout(poll, 100);
  })();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
