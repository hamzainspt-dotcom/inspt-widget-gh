<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Statement of Account – INSPT</title>
<!-- agent-ledger.html v11 | INSPT Policy Accounting System | 2026-06-12 | v11: Download Excel button (SheetJS) exports displayed SOA entries. Contra logic unchanged from v10. -->
<script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F8F4EF;
    --card: #FFFFFF;
    --primary: #6B3A2A;
    --accent: #B5622A;
    --pos: #2A7D4F;
    --neg: #C0392B;
    --text: #2C1810;
    --text2: #8B6B5A;
    --border: #E8DDD5;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF; /* must stay white — Zoho iframe border behaviour */
    color: var(--text);
    font-size: 13px;
    padding: 14px;
  }

  .fade-in { animation: fadeIn .45s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Header ---------- */
  .header {
    background: linear-gradient(120deg, #6B3A2A 0%, #8A4A30 70%, #B5622A 100%);
    border-radius: 12px;
    padding: 18px 22px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .header .sub { font-size: 12px; opacity: .85; margin-top: 3px; }
  .header .refreshed { font-size: 11px; opacity: .75; text-align: right; }

  /* ---------- KPI cards ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .kpi {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: box-shadow .25s ease, transform .25s ease;
  }
  .kpi:hover { box-shadow: 0 6px 16px rgba(107,58,42,.14); transform: translateY(-2px); }
  .kpi .label { font-size: 10.5px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .kpi .value { font-size: 19px; font-weight: 700; margin-top: 4px; color: var(--primary); font-variant-numeric: tabular-nums; }
  .kpi .value.pos { color: var(--pos); }
  .kpi .value.neg { color: var(--neg); }
  .kpi .hint { font-size: 10.5px; color: var(--text2); margin-top: 2px; }

  /* ---------- Agent selector ---------- */
  .selector-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .selector-row label { font-size: 12px; font-weight: 600; color: var(--primary); }
  select#agentSelect {
    font: inherit;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    min-width: 260px;
    cursor: pointer;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  select#agentSelect:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(181,98,42,.15); }
  .agent-count { font-size: 11px; color: var(--text2); }

  /* ---------- Excel download button ---------- */
  #excelBtn {
    margin-left: auto;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--primary);
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    outline: none;
    transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  #excelBtn:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px rgba(107,58,42,.25); transform: translateY(-1px); }
  #excelBtn:active { transform: translateY(0); }
  #excelBtn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  #excelBtn svg { width: 14px; height: 14px; }

  /* ---------- SOA card ---------- */
  .soa-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 5px rgba(107,58,42,.07);
    opacity: 1;
    transition: opacity .25s ease;
  }
  .soa-card.switching { opacity: 0; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 680px; }
  thead th {
    background: var(--primary);
    color: #fff;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 10px 12px;
    white-space: nowrap;
  }
  thead th.num { text-align: right; }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr { transition: background .15s ease; }
  tbody tr:hover { background: #FBF7F2; }
  .ref { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .desc { font-weight: 500; }
  td.bal { font-weight: 700; }
  td.bal.pos { color: var(--pos); }
  td.bal.neg { color: var(--neg); }
  .debit { color: var(--pos); }
  .credit { color: var(--neg); }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.receivable { background: rgba(42,125,79,.12); color: var(--pos); }
  .badge.payable { background: rgba(192,57,43,.12); color: var(--neg); }
  .badge.settlement { background: rgba(181,98,42,.14); color: var(--accent); }

  /* ---------- Sticky balance footer ---------- */
  .balance-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--cream);
    border-top: 2px solid var(--border);
    flex-wrap: wrap;
    gap: 6px;
  }
  .balance-footer .lbl { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .balance-footer .amt { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .balance-footer .amt.pos { color: var(--pos); }
  .balance-footer .amt.neg { color: var(--neg); }
  .balance-footer .who { font-size: 11.5px; font-weight: 600; }
  .balance-footer .who.pos { color: var(--pos); }
  .balance-footer .who.neg { color: var(--neg); }

  /* ---------- Loading / error / empty ---------- */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 60px 0;
    color: var(--text2);
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #errorBox {
    display: none;
    background: rgba(192,57,43,.08);
    border: 1px solid rgba(192,57,43,.3);
    color: var(--neg);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 12px 0;
    font-size: 12.5px;
  }

  #warnBox {
    display: none;
    background: rgba(181,98,42,.1);
    border: 1px solid rgba(181,98,42,.35);
    color: #8A4A20;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 12px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 16px;
    color: var(--text2);
  }
  .empty-state .icon { font-size: 34px; margin-bottom: 8px; }
  .empty-state .big { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }

  #app { display: none; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading statement of account…</div>
</div>

<div id="errorBox"></div>

<div id="app">
  <div id="warnBox"></div>
  <div class="header fade-in">
    <div>
      <h1>Agent Statement of Account</h1>
      <div class="sub">Outstanding entries from 01-May-2026</div>
    </div>
    <div class="refreshed" id="refreshedAt"></div>
  </div>

  <div class="kpis fade-in" style="animation-delay:.05s">
    <div class="kpi">
      <div class="label">Total Receivable</div>
      <div class="value pos" id="kpiReceivable">0.000 OMR</div>
      <div class="hint">Full commission due from placement agencies</div>
    </div>
    <div class="kpi">
      <div class="label">Total Payable</div>
      <div class="value neg" id="kpiPayable">0.000 OMR</div>
      <div class="hint">Commission shared owed to source agents</div>
    </div>
    <div class="kpi">
      <div class="label">Settlements</div>
      <div class="value" id="kpiSettlements">0.000 OMR</div>
      <div class="hint">Total this period</div>
    </div>
    <div class="kpi">
      <div class="label">Net Position</div>
      <div class="value" id="kpiNet">0.000 OMR</div>
      <div class="hint" id="kpiNetHint">&nbsp;</div>
    </div>
  </div>

  <div class="selector-row fade-in" style="animation-delay:.1s">
    <label for="agentSelect">Agent:</label>
    <select id="agentSelect"></select>
    <span class="agent-count" id="agentCount"></span>
    <button id="excelBtn" type="button" title="Download the displayed statement as an Excel file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Excel
    </button>
  </div>

  <div class="soa-card fade-in" style="animation-delay:.15s" id="soaCard"></div>
</div>

<script>
/* =====================================================================
   Agent Ledger SOA Widget v10 — INSPT
   Zoho Creator Widget SDK v2 (SigmaSDK boot, snake_case, cursor paging)
   CONTRA LOGIC (2026-06-11, per MS):
   - Receivable: placement agency owes INSPT the FULL Commission ('Direct' excluded — no broker).
   - Payable: Commission_Shared is ALWAYS what INSPT gives the source agent. Never a receivable.
   ===================================================================== */

/*CORE-START*/
// ---------- Pure helpers (testable) ----------

function lookupVal(field) {
  // Lookup fields: v2 API returns {display_value, ID}; v2.1 API (used by SDK getRecords)
  // returns {<DisplayFieldName>, ID, zc_display_value}. Empty lookup: {} or ''.
  if (field === null || field === undefined) return '';
  if (typeof field === 'object') {
    var dv = field.display_value !== undefined ? field.display_value : field.zc_display_value;
    return String(dv || '').trim();
  }
  return String(field).trim();
}

function num(v) {
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

var MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

function parseDMY(s) {
  // "dd-MMM-yyyy" -> timestamp; unparseable dates sort first
  if (!s) return 0;
  var m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec(String(s).trim());
  if (!m) {
    var d = new Date(s);
    return isNaN(d.getTime()) ? 0 : d.getTime();
  }
  var mon = MONTHS[m[2].charAt(0).toUpperCase() + m[2].slice(1).toLowerCase()];
  if (mon === undefined) return 0;
  return new Date(parseInt(m[3], 10), mon, parseInt(m[1], 10)).getTime();
}

function fmtOMR(v) {
  var sign = v < 0 ? '-' : '';
  var abs = Math.abs(v);
  var parts = abs.toFixed(3).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign + parts[0] + '.' + parts[1] + ' OMR';
}

// Build transaction rows per agent from raw records.
// Returns { agents: { name: [rows...] }, totals: {receivable, payable, settlements, net} }
function buildLedger(policies, settlements) {
  var agents = {};
  var totals = { receivable: 0, payable: 0, settlements: 0, net: 0 };

  function rowsFor(name) {
    if (!agents[name]) agents[name] = [];
    return agents[name];
  }

  (policies || []).forEach(function (p) {
    if (String(p.Agent_Commission_Status || '').trim() !== 'Unsettled') return;
    var ts = parseDMY(p.Invoice_Date);
    var desc = [String(p.Insured_Name || '').trim(), String(p.Policy_Number || '').trim()]
      .filter(Boolean).join(' | ');

    // SIDE 1 — placement agency owes INSPT the FULL Commission (receivable).
    // 'Direct' means INSPT placed directly with the insurer — no broker, no receivable.
    var placement = lookupVal(p.Insurer_Agents);
    var commission = num(p.Commission);
    if (placement && placement !== 'Direct' && commission !== 0) {
      rowsFor(placement).push({
        ts: ts, date: p.Invoice_Date || '', ref: String(p.Reference_Number || '').trim(),
        desc: desc || 'Policy entry', type: 'Receivable', debit: commission, credit: 0
      });
      totals.receivable += commission;
    }

    // SIDE 2 — INSPT owes referral agent Commission_Shared (payable).
    // Commission_Shared is always an outflow — never counted as receivable.
    var source = lookupVal(p.Sources_of_Business);
    var refAgent = String(p.Agent_Source_Details || '').trim();
    var shared = num(p.Commission_Shared);
    if (source === 'Agent' && refAgent && shared !== 0) {
      rowsFor(refAgent).push({
        ts: ts, date: p.Invoice_Date || '', ref: String(p.Reference_Number || '').trim(),
        desc: desc || 'Policy entry', type: 'Payable', debit: 0, credit: shared
      });
      totals.payable += shared;
    }
  });

  (settlements || []).forEach(function (s) {
    var agent = lookupVal(s.Agent);
    if (!agent) return;
    var amount = num(s.Amount);
    if (amount === 0) return;
    var dir = String(s.Direction || '').trim();
    var notes = String(s.Notes || '').trim();
    var row = {
      ts: parseDMY(s.Settlement_Date), date: s.Settlement_Date || '', ref: '',
      desc: notes || 'Settlement', type: 'Settlement', debit: 0, credit: 0
    };
    if (dir === 'Agent pays INSPT') {
      row.credit = amount;          // reduces what the agent owes
    } else if (dir === 'INSPT pays Agent') {
      row.debit = amount;           // increases net towards agent-owes-INSPT
    } else {
      return;                       // unknown direction — skip
    }
    rowsFor(agent).push(row);
    totals.settlements += amount;
  });

  // Sort chronologically ascending and compute running balance per agent
  Object.keys(agents).forEach(function (name) {
    agents[name].sort(function (a, b) { return a.ts - b.ts; });
    var bal = 0;
    agents[name].forEach(function (r) {
      bal += r.debit - r.credit;    // positive = agent owes INSPT
      r.balance = bal;
    });
  });

  // Net position = sum of every agent's final balance
  totals.net = Object.keys(agents).reduce(function (acc, name) {
    var rows = agents[name];
    return acc + (rows.length ? rows[rows.length - 1].balance : 0);
  }, 0);

  return { agents: agents, totals: totals };
}
/*CORE-END*/

// ---------- DOM / SDK layer ----------

var APP_NAME = 'inspt-policy-accounting-system';
var booted = false;
var ledger = null;

function showError(msg) {
  var el = document.getElementById('errorBox');
  document.getElementById('loading').style.display = 'none';
  el.style.display = 'block';
  el.textContent = msg;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function fetchAllPages(reportName) {
  var allRecords = [];
  var cursor = null;
  while (true) {
    var params = {
      app_name: APP_NAME,
      report_name: reportName,
      max_records: 200
    };
    if (cursor) params.record_cursor = cursor;
    var resp = await ZOHO.CREATOR.DATA.getRecords(params);
    if (!resp || resp.code !== 3000 || !resp.data || resp.data.length === 0) break;
    allRecords = allRecords.concat(resp.data);
    if (resp.data.length < 200 || !resp.record_cursor) break;
    cursor = resp.record_cursor;
  }
  return allRecords;
}

function animateCounter(el, target, formatter) {
  var start = null;
  var dur = 300;
  function step(t) {
    if (start === null) start = t;
    var p = Math.min((t - start) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3); // ease-out
    el.textContent = formatter(target * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderKPIs(t) {
  animateCounter(document.getElementById('kpiReceivable'), t.receivable, fmtOMR);
  animateCounter(document.getElementById('kpiPayable'), t.payable, fmtOMR);
  animateCounter(document.getElementById('kpiSettlements'), t.settlements, fmtOMR);
  var netEl = document.getElementById('kpiNet');
  netEl.classList.remove('pos', 'neg');
  netEl.classList.add(t.net >= 0 ? 'pos' : 'neg');
  document.getElementById('kpiNetHint').textContent =
    t.net >= 0 ? 'Agents owe INSPT (net)' : 'INSPT owes agents (net)';
  animateCounter(netEl, t.net, fmtOMR);
}

function renderAgentOptions(names) {
  var sel = document.getElementById('agentSelect');
  sel.innerHTML = '';
  names.forEach(function (n) {
    var o = document.createElement('option');
    o.value = n;
    o.textContent = n;
    sel.appendChild(o);
  });
  document.getElementById('agentCount').textContent =
    names.length + ' agent' + (names.length === 1 ? '' : 's') + ' with activity';
}

function renderSOA(agentName) {
  var card = document.getElementById('soaCard');
  var rows = (ledger.agents[agentName] || []);

  if (!rows.length) {
    card.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">&#128203;</div>' +
        '<div class="big">No outstanding activity</div>' +
        '<div>' + esc(agentName || 'This agent') + ' has no unsettled entries or settlements in this period.</div>' +
      '</div>';
    return;
  }

  var html = '<div class="table-wrap"><table><thead><tr>' +
    '<th>Date</th><th>Reference / Description</th><th>Type</th>' +
    '<th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function (r) {
    var badgeCls = r.type.toLowerCase();
    html += '<tr>' +
      '<td>' + esc(r.date || '—') + '</td>' +
      '<td><div class="desc">' + esc(r.desc) + '</div>' +
        (r.ref ? '<div class="ref">' + esc(r.ref) + '</div>' : '') + '</td>' +
      '<td><span class="badge ' + badgeCls + '">' + r.type + '</span></td>' +
      '<td class="num">' + (r.debit ? '<span class="debit">' + fmtOMR(r.debit) + '</span>' : '–') + '</td>' +
      '<td class="num">' + (r.credit ? '<span class="credit">' + fmtOMR(r.credit) + '</span>' : '–') + '</td>' +
      '<td class="num bal ' + (r.balance >= 0 ? 'pos' : 'neg') + '">' + fmtOMR(r.balance) + '</td>' +
      '</tr>';
  });

  var net = rows[rows.length - 1].balance;
  var cls = net >= 0 ? 'pos' : 'neg';
  var who = net >= 0 ? 'Agent owes INSPT' : 'INSPT owes Agent';
  if (Math.abs(net) < 0.0005) who = 'Fully settled';

  html += '</tbody></table></div>' +
    '<div class="balance-footer">' +
      '<span class="lbl">Current Net Balance — ' + esc(agentName) + '</span>' +
      '<span><span class="amt ' + cls + '">' + fmtOMR(net) + '</span> ' +
      '<span class="who ' + cls + '">&nbsp;' + who + '</span></span>' +
    '</div>';

  card.innerHTML = html;
}

/* ---------- Excel export (v11) ----------
   Exports EXACTLY the rows rendered for the selected agent, plus the
   KPI context and net-balance footer. Real .xlsx via SheetJS. */
function exportExcel() {
  if (!ledger) return;
  if (typeof XLSX === 'undefined') {
    showWarn('Excel library failed to load — check internet connection and refresh.');
    return;
  }
  var agentName = document.getElementById('agentSelect').value || '';
  var rows = (ledger.agents[agentName] || []);

  var aoa = [];
  aoa.push(['Agent Statement of Account — INSPT']);
  aoa.push(['Agent:', agentName]);
  aoa.push(['Outstanding entries from 01-May-2026']);
  aoa.push(['Generated:', new Date().toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  })]);
  aoa.push([]);
  aoa.push(['Date', 'Description', 'Reference', 'Type', 'Debit (OMR)', 'Credit (OMR)', 'Balance (OMR)']);

  rows.forEach(function (r) {
    aoa.push([
      r.date || '',
      r.desc || '',
      r.ref || '',
      r.type,
      r.debit ? r.debit : null,
      r.credit ? r.credit : null,
      r.balance
    ]);
  });

  var net = rows.length ? rows[rows.length - 1].balance : 0;
  var who = net >= 0 ? 'Agent owes INSPT' : 'INSPT owes Agent';
  if (Math.abs(net) < 0.0005) who = 'Fully settled';
  aoa.push([]);
  aoa.push(['', '', '', 'CURRENT NET BALANCE', '', '', net]);
  aoa.push(['', '', '', who]);

  var ws = XLSX.utils.aoa_to_sheet(aoa);

  // 3-decimal OMR number format on Debit/Credit/Balance columns (E,F,G)
  var headerRowIdx = 5;                       // 0-based row of the column headers
  var firstDataRow = headerRowIdx + 1;
  var lastRow = aoa.length - 1;
  for (var R = firstDataRow; R <= lastRow; R++) {
    ['E', 'F', 'G'].forEach(function (col) {
      var cell = ws[col + (R + 1)];
      if (cell && typeof cell.v === 'number') { cell.t = 'n'; cell.z = '#,##0.000'; }
    });
  }
  ws['!cols'] = [
    { wch: 12 },  // Date
    { wch: 52 },  // Description
    { wch: 26 },  // Reference
    { wch: 22 },  // Type / footer label
    { wch: 14 },  // Debit
    { wch: 14 },  // Credit
    { wch: 14 }   // Balance
  ];

  var wb = XLSX.utils.book_new();
  var sheetName = agentName.replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31) || 'SOA';
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  var safe = agentName.replace(/[^A-Za-z0-9 _-]/g, '').trim().replace(/\s+/g, '_') || 'Agent';
  var d = new Date();
  var fname = 'INSPT_Agent_SOA_' + safe + '_' +
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0') + '.xlsx';
  XLSX.writeFile(wb, fname);
}

function onAgentChange() {
  var card = document.getElementById('soaCard');
  card.classList.add('switching');
  var name = document.getElementById('agentSelect').value;
  setTimeout(function () {
    renderSOA(name);
    card.classList.remove('switching');
  }, 180);
}

function showWarn(msg) {
  var el = document.getElementById('warnBox');
  el.style.display = 'block';
  el.textContent = msg;
}

// The Agent_Settlements FORM exists but may have no REPORT yet (v2 API reads
// reports only). Try known link names; if none resolve, degrade gracefully.
var SETTLEMENT_REPORT_CANDIDATES = ['All_Agent_Settlements', 'Agent_Settlements', 'Agent_Settlements_Report'];

async function fetchSettlementsSafe() {
  for (var i = 0; i < SETTLEMENT_REPORT_CANDIDATES.length; i++) {
    try {
      return await fetchAllPages(SETTLEMENT_REPORT_CANDIDATES[i]);
    } catch (e) {
      // Report exists but has zero records: v2.1 API responds HTTP 400 with code
      // 9220 (v2 uses 3100 "No Data Available"). Treat as success with no settlements.
      var es = String(e && e.message || '') + ' ' + ((e && e.code) || '') + ' ' + JSON.stringify(e);
      if (/9220|3100|no data/i.test(es)) return [];
      /* otherwise try next candidate */
    }
  }
  return null; // no settlements report available
}

async function boot() {
  booted = true;
  try {
    var results = await Promise.all([
      fetchAllPages('All_Policy_Entries').catch(function (e) {
        throw new Error('All_Policy_Entries: ' + (e && e.message ? e.message : JSON.stringify(e)));
      }),
      fetchSettlementsSafe()
    ]);
    var settlementRecords = results[1];
    if (settlementRecords === null) {
      settlementRecords = [];
      showWarn('Settlements report not found in Creator — figures below exclude settlements. ' +
        'Create a report for the Agent_Settlements form (link name: All_Agent_Settlements), then refresh.');
    }
    ledger = buildLedger(results[0], settlementRecords);

    var names = Object.keys(ledger.agents).sort(function (a, b) {
      return a.localeCompare(b);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('refreshedAt').textContent =
      'Refreshed: ' + new Date().toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

    renderKPIs(ledger.totals);
    document.getElementById('excelBtn').addEventListener('click', exportExcel);

    if (!names.length) {
      document.getElementById('soaCard').innerHTML =
        '<div class="empty-state">' +
          '<div class="icon">&#128202;</div>' +
          '<div class="big">No outstanding activity</div>' +
          '<div>No unsettled policy entries or settlements found.</div>' +
        '</div>';
      document.getElementById('agentCount').textContent = '0 agents';
      return;
    }

    renderAgentOptions(names);
    document.getElementById('agentSelect').addEventListener('change', onAgentChange);
    renderSOA(names[0]);
  } catch (e) {
    showError('Failed to load data: ' + (e && e.message ? e.message : JSON.stringify(e)));
  }
}

// ---------- Boot pattern (SDK v2 — do not change) ----------
// Safety timeout registered BEFORE init. It ONLY shows an error — it NEVER calls boot().
setTimeout(function () {
  if (!booted) {
    showError('Widget timed out. Not embedded in Creator?');
  }
}, 15000);

try {
  if (typeof SigmaSDK !== 'undefined' && SigmaSDK.CREATOR && SigmaSDK.CREATOR.init) {
    SigmaSDK.CREATOR.init(function () {
      if (!booted) boot();
    });
  } else if (typeof ZOHO !== 'undefined' && ZOHO.CREATOR && ZOHO.CREATOR.DATA) {
    boot();
  } else {
    showError('Zoho Creator SDK not found.');
  }
} catch (e) {
  showError('SDK error: ' + e.message);
}
</script>
