<!-- INSPT Employee Dashboard v3 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>INSPT — Employee Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Zoho Creator widget SDK (optional; used ONLY for an optional greeting name. Page renders 100% without it.) -->
<script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
  /* ============================ TOKENS ============================ */
  :root{
    --primary:#6B3A2A; --primary-soft:#8A4A30; --accent:#B5622A;
    --gold:#C9954A; --cream:#F8F4EF; --text:#2C1810; --pos:#2A7D4F;

    /* readable muted ink (solid, ~6:1 on frosted glass — not a washed gray) */
    --ink-soft:#6E5547;
    --ink-faint:#8A7565;

    /* glass system */
    --glass-hi:rgba(255,255,255,.60);
    --glass-lo:rgba(255,255,255,.30);
    --glass-border:rgba(255,255,255,.62);
    --hairline:rgba(107,58,42,.10);

    /* semantic shadow ramp */
    --shadow-sm:0 4px 14px rgba(107,58,42,.12);
    --shadow-md:0 10px 30px rgba(107,58,42,.16);
    --shadow-lg:0 26px 60px -12px rgba(107,58,42,.30);

    /* z-index scale */
    --z-bg:0; --z-grain:1; --z-content:2;

    --ease:cubic-bezier(.2,.8,.2,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    min-height:100%;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    /* full-bleed warm base — the deliberate non-white exception so glass reads as glass.
       Deeper, warmer sand so the frosted tiles float over colour and refract it. */
    background:
      radial-gradient(1100px 640px at 12% -8%, #F6E8D0 0%, transparent 56%),
      radial-gradient(940px 560px at 98% 2%, #E9CDA6 0%, transparent 54%),
      radial-gradient(900px 700px at 70% 112%, #D9A56E 0%, transparent 52%),
      linear-gradient(150deg,#F1E3CE 0%,#E7D0B2 52%,#DCBE9B 100%);
    background-attachment:fixed;
  }

  /* ===================== LIVING BACKGROUND ===================== */
  .aurora{ position:fixed; inset:0; z-index:var(--z-bg); overflow:hidden; pointer-events:none; }
  .bloom{ position:absolute; border-radius:50%; filter:blur(60px); will-change:transform; }
  .bloom.b1{ width:50vmax; height:50vmax; left:-10vmax; top:-14vmax;
    background:radial-gradient(circle at 32% 32%, rgba(201,149,74,.66), transparent 68%);
    animation:drift1 30s ease-in-out infinite; }
  .bloom.b2{ width:46vmax; height:46vmax; right:-12vmax; bottom:-16vmax;
    background:radial-gradient(circle at 60% 40%, rgba(181,98,42,.60), transparent 68%);
    animation:drift2 38s ease-in-out infinite; }
  .bloom.b3{ width:34vmax; height:34vmax; right:12vw; top:-8vmax;
    background:radial-gradient(circle at 50% 50%, rgba(122,64,42,.44), transparent 70%);
    animation:drift3 46s ease-in-out infinite; }
  .bloom.b4{ width:32vmax; height:32vmax; left:14vw; bottom:-10vmax;
    background:radial-gradient(circle at 50% 50%, rgba(138,74,48,.36), transparent 70%);
    animation:drift1 52s ease-in-out infinite reverse; }
  /* soft warm haze that sits behind the grid so the glass has colour to refract */
  .bloom.b5{ width:42vmax; height:42vmax; left:50%; top:46%; margin:-21vmax 0 0 -21vmax;
    background:radial-gradient(circle at 50% 50%, rgba(181,98,42,.22), transparent 66%);
    animation:drift2 42s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 50%{ transform:translate3d(4vmax,3vmax,0) scale(1.08); } }
  @keyframes drift2{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 50%{ transform:translate3d(-5vmax,-3vmax,0) scale(1.10); } }
  @keyframes drift3{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 50%{ transform:translate3d(-3vmax,4vmax,0) scale(1.06); } }

  /* soft keynote vignette for edge depth */
  .vignette{ position:fixed; inset:0; z-index:var(--z-bg); pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%, transparent 56%, rgba(76,40,26,.10) 100%); }

  /* fine film grain */
  .grain{ position:fixed; inset:0; z-index:var(--z-grain); pointer-events:none; opacity:.045; mix-blend-mode:multiply; }

  /* ============================ LAYOUT ============================ */
  .wrap{ position:relative; z-index:var(--z-content); max-width:1060px; margin:0 auto;
    padding:clamp(26px,5vw,46px) clamp(18px,4vw,26px) 52px; }

  /* ============================ HEADER ============================ */
  header.hero{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:clamp(20px,3vw,26px) clamp(20px,3vw,28px); border-radius:26px;
    background:linear-gradient(160deg, var(--glass-hi), var(--glass-lo));
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.70);
    opacity:0; transform:translateY(16px) scale(.985);
    animation:rise .8s var(--ease) .05s forwards;
  }
  .greet{ min-width:0; }
  .greet h1{
    margin:0; font-family:'Fraunces',Georgia,serif; font-weight:600;
    font-size:clamp(26px,4.4vw,42px); line-height:1.02; letter-spacing:-.018em;
    color:var(--text); text-wrap:balance;
  }
  .greet h1 .name{ color:var(--accent); }
  .dateline{ margin:10px 0 0; color:var(--ink-soft); font-size:clamp(13px,1.6vw,15px); font-weight:500; letter-spacing:.005em; }

  /* brand lockup */
  .brand{ flex:none; display:flex; align-items:center; gap:12px;
    opacity:0; animation:fade .8s ease .28s forwards; }
  .brand-mark{
    width:46px; height:46px; border-radius:14px; display:grid; place-items:center;
    background:linear-gradient(140deg, var(--gold), var(--accent) 70%, var(--primary-soft));
    box-shadow:0 8px 20px rgba(181,98,42,.38), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .brand-mark svg{ width:24px; height:24px; }
  .brand-name{ display:flex; flex-direction:column; line-height:1; }
  .brand-name b{ font-weight:800; font-size:18px; letter-spacing:.20em; color:var(--primary); }
  .brand-name small{ margin-top:5px; font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
  @media (max-width:520px){ .brand-name{ display:none; } }

  /* ===================== SECTION LABEL ===================== */
  .section-label{
    margin:clamp(26px,4vw,34px) 4px 16px; display:flex; align-items:center; gap:12px;
    font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    opacity:0; animation:fade .6s ease .34s forwards;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--hairline), transparent); }

  /* ============================ GRID ============================ */
  .grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(14px,1.8vw,18px); }
  @media (max-width:780px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:500px){ .grid{ grid-template-columns:1fr; } }

  /* grid cell handles the staggered ENTRANCE (kept off the button so tilt transforms stay free) */
  .cell{ opacity:0; transform:translateY(20px) scale(.96); animation:rise .62s var(--ease) forwards; }

  /* ============================ TILE ============================ */
  .tile{
    --rx:0deg; --ry:0deg; --ty:0px; --sc:1;
    position:relative; overflow:hidden; width:100%; text-align:left; cursor:pointer;
    display:flex; flex-direction:column; gap:13px;
    padding:22px 20px 18px; min-height:160px;
    border-radius:22px; border:1px solid var(--glass-border);
    background:linear-gradient(160deg, var(--glass-hi), var(--glass-lo));
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.62);
    color:var(--text); font-family:inherit;
    transform:perspective(820px) rotateX(var(--rx)) rotateY(var(--ry)) translate3d(0,var(--ty),0) scale(var(--sc));
    transform-style:preserve-3d;
    transition:transform .2s var(--ease), box-shadow .26s ease, background-color .26s ease;
  }
  .tile.is-live{ will-change:transform; }

  /* pointer-tracked specular light */
  .tile .glow{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(170px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.55), transparent 62%);
    opacity:0; transition:opacity .25s ease; z-index:1;
  }
  /* one-shot sheen sweep on hover (transform-only; clipped by tile overflow) */
  .tile .sheen{ position:absolute; inset:0; pointer-events:none; z-index:1; }
  .tile .sheen::before{
    content:""; position:absolute; top:-60%; left:0; width:42%; height:220%;
    transform:translateX(-160%) rotate(9deg); opacity:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  }

  /* SIGNATURE: traveling gradient hairline — a comet of the tile's accent orbiting the edge */
  @property --bx{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
  .tile .ring{
    position:absolute; inset:0; border-radius:inherit; padding:1.5px; pointer-events:none; z-index:2;
    background:conic-gradient(from var(--bx),
      transparent 0 30%,
      var(--ac) 42%, var(--gold) 50%, var(--ac) 58%,
      transparent 70% 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .35s ease;
  }

  /* content above the light layers */
  .tile > .chip,
  .tile > .label,
  .tile > .hint,
  .tile > .go{ position:relative; z-index:3; }

  .chip{
    position:relative; width:50px; height:50px; border-radius:15px; display:grid; place-items:center; flex:none;
    color:var(--ac);
    background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.75);
    box-shadow:0 5px 14px rgba(107,58,42,.14), inset 0 1px 0 rgba(255,255,255,.85);
    transition:transform .22s var(--ease);
  }
  .chip::before{ /* accent halo that ignites on hover */
    content:""; position:absolute; inset:-7px; border-radius:20px; z-index:-1;
    background:radial-gradient(circle, color-mix(in srgb, var(--ac) 42%, transparent), transparent 70%);
    opacity:0; transition:opacity .26s ease;
  }
  .chip svg{ width:26px; height:26px; }

  .tile .label{ font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .tile .hint{ font-size:13px; color:var(--ink-soft); font-weight:500; margin-top:-5px; line-height:1.45; }
  .tile .go{ position:absolute; top:20px; right:18px; color:var(--ink-faint); opacity:.5;
    transition:transform .22s var(--ease), opacity .22s ease, color .22s ease; }

  /* ---- states ---- */
  .tile:hover{
    --ty:-6px;
    background-color:rgba(255,255,255,.42);
    box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.72);
  }
  .tile:hover .glow{ opacity:1; }
  .tile:hover .chip{ transform:translateY(-1px) scale(1.04); }
  .tile:hover .chip::before{ opacity:.95; }
  .tile:hover .go{ transform:translateX(4px); opacity:.95; color:var(--ac); }
  .tile:hover .ring,
  .tile:focus-visible .ring{ opacity:1; animation:spin 3.4s linear infinite; }
  .tile:hover .sheen::before{ animation:sweep .85s ease; }

  .tile:active{ --ty:-2px; --sc:.985; transition:transform .09s ease; }

  .tile:focus-visible{ outline:3px solid color-mix(in srgb, var(--ac) 70%, white); outline-offset:3px; }
  .tile:focus-visible{ box-shadow:var(--shadow-md), 0 0 0 6px color-mix(in srgb, var(--ac) 16%, transparent), inset 0 1px 0 rgba(255,255,255,.7); }

  /* click ripple */
  .ripple{ position:absolute; z-index:1; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.6), transparent 70%);
    transform:translate(-50%,-50%) scale(0); animation:ripple .6s ease-out forwards; }

  /* ============================ FOOTER ============================ */
  footer{ margin-top:34px; text-align:center; color:var(--ink-faint); font-size:12px; font-weight:500;
    opacity:0; animation:fade .6s ease .7s forwards; }

  /* ============================ KEYFRAMES ============================ */
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes fade{ to{ opacity:1; } }
  @keyframes spin{ to{ --bx:360deg; } }
  @keyframes sweep{ 0%{ opacity:0; transform:translateX(-160%) rotate(9deg); }
    35%{ opacity:.95; } 100%{ opacity:0; transform:translateX(360%) rotate(9deg); } }
  @keyframes ripple{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* ============================ REDUCED MOTION ============================ */
  @media (prefers-reduced-motion: reduce){
    .bloom{ animation:none; }
    .hero,.brand,.section-label,.cell,footer{ animation:none; opacity:1; transform:none; }
    .tile{ transition:box-shadow .2s ease, background-color .2s ease; transform:none; }
    .tile .glow,.tile .ring,.tile .go,.chip,.chip::before{ transition:none; }
    .tile:hover .ring,.tile:focus-visible .ring{ animation:none; opacity:1; }
    .tile:hover .sheen::before{ animation:none; }
    .ripple{ display:none; }
  }
</style>
</head>
<body>
  <!-- living background -->
  <div class="aurora">
    <div class="bloom b1"></div>
    <div class="bloom b2"></div>
    <div class="bloom b3"></div>
    <div class="bloom b4"></div>
    <div class="bloom b5"></div>
  </div>
  <div class="vignette"></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#grainf)"/>
  </svg>

  <main class="wrap">
    <header class="hero">
      <div class="greet">
        <h1 id="greeting">Welcome back</h1>
        <p class="dateline" id="dateline">&nbsp;</p>
      </div>
      <div class="brand" aria-label="INSPT — Insurance Spot">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-6.5-5-6.5-10a6.5 6.5 0 0 1 13 0c0 5-6.5 10-6.5 10Z"/>
            <circle cx="12" cy="11" r="2.4" fill="#fff" stroke="none"/>
          </svg>
        </span>
        <span class="brand-name"><b>INSPT</b><small>Insurance Spot</small></span>
      </div>
    </header>

    <div class="section-label">Quick actions</div>
    <div class="grid" id="grid"></div>

    <footer>Insurance Spot · Employee workspace</footer>
  </main>

<script>
/* ============================ CONFIG / TILES ============================ */
/* Edit targets here — all navigation lives in this one object. */
var BASE = 'https://creatorapp.zoho.com/mohammadhamza383/inspt-policy-accounting-system/';
var TILES = [
  { id:'policy',   label:'Add Policy',     hint:'Create a new policy entry', icon:'file-plus',    accent:'#B5622A', url: BASE + '#Page:Add_Policy' },
  { id:'tasks',    label:'My Tasks',       hint:'Your open tasks',           icon:'list-checks',  accent:'#2A7D4F', url: BASE + '#Report:My_Open_Tasks' },
  { id:'prospect', label:'Add Prospect',   hint:'Log a new lead or quote',   icon:'user-plus',    accent:'#C9954A', url: BASE + '#Form:Prospect_Client' },
  { id:'claim',    label:'Claim Updates',  hint:'Update a claim',            icon:'shield-alert', accent:'#A23E2A', url: BASE + '#Form:Claim_Management' },
  { id:'visit',    label:'Log Visit',      hint:'Record an official visit',  icon:'map-pin',      accent:'#7A5230', url: BASE + '#Form:Official_Visit_Register' },
  { id:'ticket',   label:'Raise a Ticket', hint:'Report an internal issue',  icon:'life-buoy',    accent:'#8A4A30', url: BASE + '#Form:Raise_a_Ticket' }
];

var TUNE = { tilt:7, stagger:0.07, lead:0.16 }; /* tilt degrees, per-tile delay, first-tile delay */

/* Lucide-style line icons (~1.8 stroke, currentColor) */
var ICONS = {
  'file-plus':'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7l-5-5Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>',
  'shield-alert':'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  'list-checks':'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><line x1="13" y1="6" x2="21" y2="6"/><line x1="13" y1="12" x2="21" y2="12"/><line x1="13" y1="18" x2="21" y2="18"/>',
  'user-plus':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
  'map-pin':'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  'life-buoy':'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>'
};
var ARROW = '<svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

/*CORE-START*/  /* pure logic — unit-extractable */
function getGreeting(hour){
  if (hour < 12) return 'Good morning';
  if (hour < 17) return 'Good afternoon';
  return 'Good evening';
}
function formatDate(d){
  try{
    return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }catch(e){
    return d.toDateString();
  }
}
/*CORE-END*/

(function(){
  var reduce = false;
  try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  function svgIcon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
  }
  function navigate(url){
    // Opening a form = PARENT navigation. SDK navigate API rejects raw URLs, so use window.top.
    try{ window.top.location.href = url; }catch(e){ window.location.href = url; }
  }

  var grid = document.getElementById('grid');

  TILES.forEach(function(t, i){
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.animationDelay = (TUNE.lead + i * TUNE.stagger) + 's';

    var b = document.createElement('button');
    b.className = 'tile';
    b.type = 'button';
    b.style.setProperty('--ac', t.accent);
    b.setAttribute('aria-label', t.label + ' — ' + t.hint);
    b.innerHTML =
      '<span class="glow"></span>' +
      '<span class="sheen"></span>' +
      '<span class="ring"></span>' +
      '<span class="chip">'+svgIcon(t.icon)+'</span>' +
      '<span class="label">'+t.label+'</span>' +
      '<span class="hint">'+t.hint+'</span>' +
      ARROW;

    b.addEventListener('click', function(){ navigate(t.url); });

    if (!reduce){
      var rect = null;
      b.addEventListener('pointerenter', function(){
        rect = b.getBoundingClientRect();   // cache once — never measured during move
        b.classList.add('is-live');
      });
      b.addEventListener('pointermove', function(ev){
        if (!rect) rect = b.getBoundingClientRect();
        var px = (ev.clientX - rect.left) / rect.width;   // 0..1
        var py = (ev.clientY - rect.top)  / rect.height;  // 0..1
        // only writes CSS vars — composited transform, never triggers layout
        b.style.setProperty('--mx', (px * 100) + '%');
        b.style.setProperty('--my', (py * 100) + '%');
        b.style.setProperty('--ry', ((px - 0.5) *  TUNE.tilt) + 'deg');
        b.style.setProperty('--rx', ((0.5 - py) *  TUNE.tilt) + 'deg');
      });
      b.addEventListener('pointerleave', function(){
        b.classList.remove('is-live');
        b.style.setProperty('--rx', '0deg');
        b.style.setProperty('--ry', '0deg');
        rect = null;
      });
      b.addEventListener('pointerdown', function(ev){
        var r = rect || b.getBoundingClientRect();
        var rip = document.createElement('span');
        rip.className = 'ripple';
        var size = Math.max(r.width, r.height) * 1.4;
        rip.style.width = rip.style.height = size + 'px';
        rip.style.left = (ev.clientX - r.left) + 'px';
        rip.style.top  = (ev.clientY - r.top)  + 'px';
        b.appendChild(rip);
        rip.addEventListener('animationend', function(){ rip.remove(); });
      });
    }

    cell.appendChild(b);
    grid.appendChild(cell);
  });

  /* ---- greeting + date (renders immediately; SDK name is a later enhancement) ---- */
  var now = new Date();
  function paintGreeting(name){
    var g = getGreeting(now.getHours());
    var el = document.getElementById('greeting');
    if (name){ el.innerHTML = g + ', <span class="name"></span>'; el.querySelector('.name').textContent = name; }
    else { el.textContent = g; }
    document.getElementById('dateline').textContent = formatDate(now);
  }
  paintGreeting('');

  /* ---- optional name from Zoho SDK v2 (SigmaSDK) — never blocks first paint ---- */
  var named = false;
  function tryName(params){
    if (named) return;
    try{
      var n = params && (params.loginUser || params.loginUserName || params.user || params.userName);
      if (n && typeof n === 'string' && n.indexOf('@') === -1){ named = true; paintGreeting(n.split(' ')[0]); }
    }catch(e){}
  }
  setTimeout(function(){ /* safety: keep the generic greeting if the SDK never resolves */ }, 4000);
  try{
    if (typeof SigmaSDK !== 'undefined' && SigmaSDK.CREATOR && SigmaSDK.CREATOR.init){
      SigmaSDK.CREATOR.init(function(p){ tryName(p || {}); });
    }
  }catch(e){ /* ignore — page already rendered with a generic greeting */ }
})();
</script>
</body>
</html>
