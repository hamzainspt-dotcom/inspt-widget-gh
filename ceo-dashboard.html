<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INSPT CEO Dashboard</title>
<style>
  :root{
    --bg:#F8F4EF;
    --card:#FFFFFF;
    --shadow:0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    --shadow-hover:0 2px 6px rgba(0,0,0,0.09), 0 10px 28px rgba(0,0,0,0.08);
    --primary:#6B3A2A;
    --accent:#B5622A;
    --accent-light:#E8C4A0;
    --pos:#2A7D4F;
    --pos-bg:#EAF5EE;
    --neg:#C0392B;
    --neg-bg:#FCECEA;
    --alert:#8B5E0A;
    --alert-bg:#FEF6E4;
    --ink:#1C1410;
    --ink-2:#7A6455;
    --border:rgba(107,58,42,0.1);
    --r:14px;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--bg);margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.45;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 48px;}

  /* ---------- Header ---------- */
  .hdr{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:26px;
  }
  .hdr h1{
    margin:0;font-weight:500;color:var(--primary);
    font-size:clamp(1.6rem,3.2vw,2.15rem);
    letter-spacing:-0.02em;text-wrap:balance;
  }
  .hdr .sub{margin:4px 0 0;color:var(--ink-2);font-size:0.95rem;}
  .hdr .date{
    background:var(--card);border:1px solid var(--border);
    color:var(--ink-2);font-size:0.85rem;font-weight:500;
    padding:8px 14px;border-radius:999px;white-space:nowrap;
    box-shadow:var(--shadow);
  }

  /* ---------- KPI grid ---------- */
  .kpis{
    display:grid;gap:14px;margin-bottom:22px;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  }
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--r);box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .kpi{padding:16px 18px 15px;display:flex;flex-direction:column;min-height:118px;}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .kpi .label{
    font-size:0.7rem;font-weight:600;letter-spacing:0.045em;
    text-transform:uppercase;color:var(--ink-2);margin-bottom:auto;
  }
  .kpi .val{
    font-size:clamp(1.35rem,2.2vw,1.7rem);font-weight:600;
    color:var(--ink);letter-spacing:-0.02em;margin:12px 0 8px;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .kpi .foot{min-height:22px;display:flex;align-items:center;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:0.78rem;font-weight:600;padding:3px 9px;border-radius:999px;
    opacity:0;transition:opacity .2s ease;
  }
  .badge.show{opacity:1;}
  .badge.up{color:var(--pos);background:var(--pos-bg);}
  .badge.down{color:var(--neg);background:var(--neg-bg);}
  .badge.flat{color:var(--ink-2);background:rgba(107,58,42,0.06);}
  .badge .arw{font-size:0.72rem;line-height:1;}
  .badge .cmp{color:var(--ink-2);font-weight:500;margin-left:2px;}

  /* alert variants (cards 5-7) */
  .kpi.alert{background:var(--alert-bg);border-color:rgba(139,94,10,0.18);}
  .kpi.alert .label{color:var(--alert);}
  .kpi.alert .val{color:#5a3d06;}
  .kpi.alert .note{font-size:0.78rem;color:var(--alert);font-weight:500;}
  .kpi.alert.danger{background:var(--neg-bg);border-color:rgba(192,57,43,0.22);}
  .kpi.alert.danger .label{color:var(--neg);}
  .kpi.alert.danger .val{color:var(--neg);}
  .kpi.alert.danger .note{color:var(--neg);}

  /* ---------- Charts ---------- */
  .charts{display:grid;gap:14px;margin-bottom:22px;grid-template-columns:3fr 2fr;}
  @media (max-width:840px){.charts{grid-template-columns:1fr;}}
  .panel{padding:18px 20px 20px;}
  .panel h2,.tbl-wrap h2{
    margin:0 0 14px;font-size:1.02rem;font-weight:600;
    color:var(--primary);letter-spacing:-0.01em;
  }
  .chart-box{position:relative;height:260px;}

  /* ---------- Tables ---------- */
  .tbl-wrap{padding:18px 20px 14px;margin-bottom:22px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:0.88rem;}
  thead th{
    text-align:left;font-weight:600;color:var(--ink-2);
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;
    padding:0 14px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  thead th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  tbody td.name{font-weight:500;}
  tfoot td{
    padding:12px 14px;font-weight:600;color:var(--primary);
    border-top:2px solid var(--border);font-variant-numeric:tabular-nums;
  }
  .barcell{width:170px;min-width:120px;}
  .minibar{height:7px;border-radius:4px;background:rgba(107,58,42,0.08);overflow:hidden;}
  .minibar > span{display:block;height:100%;border-radius:4px;background:var(--accent);
    width:0;transition:width .7s cubic-bezier(.22,1,.36,1);}
  .minibar.alt > span{background:var(--primary);}
  .trow{opacity:0;}

  /* ---------- Animations ---------- */
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @keyframes rowIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .anim{opacity:0;animation:cardIn .4s ease forwards;}
  .trow.anim{animation:rowIn .35s ease forwards;}

  /* ---------- Skeleton ---------- */
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:.9;}}
  .sk{background:linear-gradient(90deg,rgba(107,58,42,0.07),rgba(107,58,42,0.11),rgba(107,58,42,0.07));
    border-radius:8px;animation:pulse 1.4s ease-in-out infinite;}
  .sk-line{height:13px;margin:8px 0;}

  /* ---------- Error ---------- */
  .errbox{
    background:var(--primary);color:#fff;border-radius:var(--r);
    padding:30px 28px;box-shadow:var(--shadow);text-align:center;
  }
  .errbox h2{margin:0 0 6px;font-weight:500;font-size:1.2rem;}
  .errbox p{margin:0;opacity:.85;font-size:0.92rem;}

  .empty{color:var(--ink-2);font-size:0.9rem;padding:18px 14px;text-align:center;}

  @media (prefers-reduced-motion: reduce){
    .anim,.trow.anim{animation:none !important;opacity:1 !important;transform:none !important;}
    .badge{opacity:1 !important;}
    .card{transition:none;}
    .minibar > span{transition:none;}
    .sk{animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <!-- Header -->
    <header class="hdr">
      <div>
        <h1 id="greeting">Good morning, MS 👋</h1>
        <p class="sub">INSPT Insurance Dashboard</p>
      </div>
      <div class="date" id="today">&nbsp;</div>
    </header>

    <!-- Content (filled by JS) -->
    <div id="content"></div>
  </div>

<script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
(function(){
  "use strict";

  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ Helpers ============ */
  var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var MNAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var FULLM = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function parseDate(str){
    if(!str) return null;
    var p = String(str).split('-');
    if(p.length !== 3 || !MONTHS.hasOwnProperty(p[1])) return null;
    return new Date(parseInt(p[2],10), MONTHS[p[1]], parseInt(p[0],10));
  }
  function getLookupName(field){
    if(!field) return null;
    var id = String(field.ID || field.id || '').trim();
    if(!id || id === '0') return null;
    var keys = Array.prototype.slice.call(arguments,1);
    if(field.display_value) return field.display_value;
    for(var i=0;i<keys.length;i++){ if(field[keys[i]]) return field[keys[i]]; }
    return null;
  }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function omr(v){
    return 'OMR ' + v.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
  }
  function intf(v){ return Math.round(v).toLocaleString('en-US'); }
  function pct1(v){ return (v>=0?'+':'') + v.toFixed(1) + '%'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function el(id){ return document.getElementById(id); }

  /* ============ Date header ============ */
  var NOW = new Date();
  var CY = NOW.getFullYear(), CM = NOW.getMonth();
  var PM = CM === 0 ? 11 : CM-1, PY = CM === 0 ? CY-1 : CY;
  el('today').textContent = DAYS[NOW.getDay()] + ', ' + NOW.getDate() + ' ' + FULLM[CM] + ' ' + CY;
  var hr = NOW.getHours();
  el('greeting').textContent = (hr<12?'Good morning':hr<17?'Good afternoon':'Good evening') + ', MS 👋';

  /* ============ Skeleton ============ */
  function skeleton(){
    var k='';
    for(var i=0;i<7;i++){
      k += '<div class="card kpi"><div class="sk sk-line" style="width:55%"></div>'+
           '<div class="sk" style="height:26px;width:75%;margin:14px 0 10px"></div>'+
           '<div class="sk sk-line" style="width:40%"></div></div>';
    }
    var ch = '<div class="charts">'+
      '<div class="card panel"><div class="sk sk-line" style="width:40%;margin-bottom:16px"></div>'+
      '<div class="sk" style="height:240px;border-radius:10px"></div></div>'+
      '<div class="card panel"><div class="sk sk-line" style="width:50%;margin-bottom:16px"></div>'+
      '<div class="sk" style="height:240px;border-radius:10px"></div></div></div>';
    function tbl(){
      var r='<div class="card tbl-wrap"><div class="sk sk-line" style="width:30%;margin-bottom:18px"></div>';
      for(var j=0;j<5;j++){ r+='<div class="sk sk-line" style="height:18px;width:'+(95-j*6)+'%"></div>'; }
      return r+'</div>';
    }
    el('content').innerHTML = '<div class="kpis">'+k+'</div>'+ch+tbl()+tbl();
  }

  /* ============ Data fetch ============ */
  function fetchAll(cb, err){
    var all = [], page = 1;
    function next(){
      ZOHO.CREATOR.DATA.getRecords({
        appName:'inspt-policy-accounting-system',
        reportName:'All_Policy_Entries',
        page:page, pageSize:200
      }).then(function(resp){
        if(!resp || resp.code !== 3000){
          // code 3100 = no records found -> treat as empty set, not an error
          if(resp && resp.code === 3100){ cb(all); return; }
          err(resp ? resp.code : 'NO_RESPONSE'); return;
        }
        var data = resp.data || [];
        all = all.concat(data);
        if(data.length < 200){ cb(all); }
        else { page++; next(); }
      }).catch(function(e){ err((e && (e.code||e.message)) || 'FETCH_FAILED'); });
    }
    next();
  }

  /* ============ Aggregation ============ */
  function compute(recs){
    var k = {
      premMTD:0, commMTD:0, netMTD:0, countMTD:0,
      premPrev:0, commPrev:0, netPrev:0, countPrev:0,
      receiptPending:0, outstanding:0, outstandingCount:0, syncFailed:0
    };
    // last 6 complete months (ending previous month)
    var buckets = [], bmap = {};
    for(var i=6;i>=1;i--){
      var dt = new Date(CY, CM-i, 1);
      var key = dt.getFullYear()+'-'+dt.getMonth();
      var b = {key:key, label:MNAMES[dt.getMonth()], total:0};
      buckets.push(b); bmap[key]=b;
    }
    var src = {Direct:0, Agent:0};
    var agents = {}, insurers = {};
    var OUTSTANDING = {'Pending':1,'Partially Paid':1,'Credit':1};

    for(var r=0;r<recs.length;r++){
      var rec = recs[r];
      var d = parseDate(rec.Invoice_Date);
      var premium = num(rec.Premium);
      var commission = num(rec.Commission);
      var net = num(rec.Net_Commission);
      var shared = num(rec.Commission_Shared);
      var status1 = (rec.Dropdown1||'').trim();

      // current / prior month
      if(d){
        if(d.getFullYear()===CY && d.getMonth()===CM){
          k.premMTD+=premium; k.commMTD+=commission; k.netMTD+=net; k.countMTD++;
        } else if(d.getFullYear()===PY && d.getMonth()===PM){
          k.premPrev+=premium; k.commPrev+=commission; k.netPrev+=net; k.countPrev++;
        }
        var bk = d.getFullYear()+'-'+d.getMonth();
        if(bmap[bk]) bmap[bk].total += premium;
      }

      // alerts
      if((rec.Receipt_Approval_Status||'').trim()==='Pending Approval') k.receiptPending++;
      if(OUTSTANDING[status1]){ k.outstanding+=premium; k.outstandingCount++; }
      if((rec.Policy_Status||'').trim()==='Invoice Sync Failed' ||
         (rec.Zoho_Books_Sync_Status||'').trim()==='Failed') k.syncFailed++;

      // source split (Direct vs Agent)
      var sname = getLookupName(rec.Sources_of_Business,'Source_Name');
      if(sname && sname.toLowerCase().indexOf('agent')!==-1) src.Agent+=premium;
      else src.Direct+=premium;

      // agent commission balance (placement agency)
      var aname = getLookupName(rec.Insurer_Agents,'Agent_Name');
      if(aname){
        if(!agents[aname]) agents[aname]={name:aname,count:0,shared:0};
        agents[aname].count++; agents[aname].shared+=shared;
      }

      // insurer breakdown
      var iname = getLookupName(rec.Insurers,'Insurer_Name');
      if(iname){
        if(!insurers[iname]) insurers[iname]={name:iname,count:0,premium:0,commission:0};
        insurers[iname].count++; insurers[iname].premium+=premium; insurers[iname].commission+=commission;
      }
    }

    var agentList = Object.keys(agents).map(function(x){return agents[x];})
      .filter(function(a){return a.shared>0;})
      .sort(function(a,b){return b.shared-a.shared;});
    var insurerList = Object.keys(insurers).map(function(x){return insurers[x];})
      .sort(function(a,b){return b.premium-a.premium;});

    return {k:k, buckets:buckets, src:src, agents:agentList, insurers:insurerList};
  }

  /* ============ MoM badge ============ */
  function momBadge(cur, prev){
    if(prev>0){
      var ch = (cur-prev)/prev*100;
      var cls = ch>=0 ? 'up' : 'down';
      var arw = ch>=0 ? '▲' : '▼';
      return '<span class="badge '+cls+'"><span class="arw">'+arw+'</span>'+pct1(ch)+
             '<span class="cmp">vs last month</span></span>';
    }
    if(cur>0) return '<span class="badge up"><span class="arw">▲</span>New<span class="cmp">vs last month</span></span>';
    return '<span class="badge flat">—<span class="cmp">vs last month</span></span>';
  }

  /* ============ Count-up ============ */
  function countUp(node, target, fmt, dur){
    if(REDUCE){ node.textContent = fmt(target); return; }
    var start = null;
    function step(ts){
      if(start===null) start=ts;
      var p = Math.min((ts-start)/(dur||800),1);
      var eased = 1 - Math.pow(1-p,3);
      node.textContent = fmt(target*eased);
      if(p<1) requestAnimationFrame(step);
      else node.textContent = fmt(target);
    }
    requestAnimationFrame(step);
  }

  /* ============ Render ============ */
  function render(model){
    var k = model.k;
    var metric = [
      {label:'Premium Written MTD', val:k.premMTD, prev:k.premPrev, fmt:omr},
      {label:'Commission Earned MTD', val:k.commMTD, prev:k.commPrev, fmt:omr},
      {label:'Net Commission MTD', val:k.netMTD, prev:k.netPrev, fmt:omr},
      {label:'Policies Issued MTD', val:k.countMTD, prev:k.countPrev, fmt:intf}
    ];
    var alerts = [
      {label:'Receipt Pending Approval', val:k.receiptPending, fmt:intf,
       note:k.receiptPending>0?'Awaiting your approval':'All receipts cleared'},
      {label:'Premium Outstanding', val:k.outstanding, fmt:omr,
       note:k.outstandingCount+' polic'+(k.outstandingCount===1?'y':'ies')+' unsettled'},
      {label:'Invoice Sync Failed', val:k.syncFailed, fmt:intf,
       danger:k.syncFailed>0, note:k.syncFailed>0?'Needs attention':'All synced'}
    ];

    var html = '<div class="kpis" id="kpis">';
    metric.forEach(function(m,i){
      html += '<div class="card kpi anim" style="animation-delay:'+(i*60)+'ms">'+
        '<div class="label">'+esc(m.label)+'</div>'+
        '<div class="val" data-val="'+m.val+'" data-fmt="'+(m.fmt===omr?'omr':'int')+'">'+(REDUCE?m.fmt(m.val):m.fmt(0))+'</div>'+
        '<div class="foot" data-mom="'+m.val+'|'+m.prev+'"></div></div>';
    });
    alerts.forEach(function(m,i){
      var idx = metric.length+i;
      html += '<div class="card kpi alert anim'+(m.danger?' danger':'')+'" style="animation-delay:'+(idx*60)+'ms">'+
        '<div class="label">'+esc(m.label)+'</div>'+
        '<div class="val" data-val="'+m.val+'" data-fmt="'+(m.fmt===omr?'omr':'int')+'">'+(REDUCE?m.fmt(m.val):m.fmt(0))+'</div>'+
        '<div class="foot"><span class="note">'+esc(m.note)+'</span></div></div>';
    });
    html += '</div>';

    // charts
    html += '<div class="charts">'+
      '<div class="card panel anim" style="animation-delay:'+(7*60)+'ms">'+
        '<h2>Monthly Premium &middot; Last 6 Months</h2>'+
        '<div class="chart-box"><canvas id="barChart"></canvas></div></div>'+
      '<div class="card panel anim" style="animation-delay:'+(8*60)+'ms">'+
        '<h2>Premium by Source</h2>'+
        '<div class="chart-box"><canvas id="donutChart"></canvas></div></div>'+
      '</div>';

    // agent table
    html += '<div class="card tbl-wrap anim" style="animation-delay:'+(9*60)+'ms">'+
      '<h2>Agent Commission Balance</h2>'+ agentTable(model.agents) +'</div>';

    // insurer table
    html += '<div class="card tbl-wrap anim" style="animation-delay:'+(10*60)+'ms">'+
      '<h2>Insurer Breakdown</h2>'+ insurerTable(model.insurers) +'</div>';

    el('content').innerHTML = html;

    // animate numbers + badges
    var vals = document.querySelectorAll('#kpis .val');
    Array.prototype.forEach.call(vals,function(node){
      var t = parseFloat(node.getAttribute('data-val'))||0;
      var fmt = node.getAttribute('data-fmt')==='omr'?omr:intf;
      countUp(node, t, fmt, 800);
    });
    var foots = document.querySelectorAll('#kpis .foot[data-mom]');
    Array.prototype.forEach.call(foots,function(node){
      var parts = node.getAttribute('data-mom').split('|');
      node.innerHTML = momBadge(parseFloat(parts[0])||0, parseFloat(parts[1])||0);
      var b = node.querySelector('.badge');
      if(REDUCE){ if(b) b.classList.add('show'); }
      else { setTimeout(function(){ if(b) b.classList.add('show'); }, 850); }
    });

    // stagger table rows + grow mini bars
    var rows = document.querySelectorAll('.trow');
    Array.prototype.forEach.call(rows,function(tr,i){
      tr.classList.add('anim');
      tr.style.animationDelay = (i*40)+'ms';
    });
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var bars = document.querySelectorAll('.minibar > span');
        Array.prototype.forEach.call(bars,function(s){ s.style.width = s.getAttribute('data-w'); });
      });
    });

    drawCharts(model);
  }

  function agentTable(list){
    if(!list.length) return '<div class="empty">No placement-agent commissions recorded.</div>';
    var max = list[0].shared || 1, totShared=0, totCount=0;
    var rows='';
    list.forEach(function(a){
      totShared+=a.shared; totCount+=a.count;
      var w = Math.max(2, a.shared/max*100).toFixed(1)+'%';
      rows += '<tr class="trow"><td class="name">'+esc(a.name)+'</td>'+
        '<td class="num">'+intf(a.count)+'</td>'+
        '<td class="num">'+omr(a.shared)+'</td>'+
        '<td class="barcell"><div class="minibar"><span data-w="'+w+'"></span></div></td></tr>';
    });
    return '<table><thead><tr>'+
      '<th>Agent Name</th><th class="num">Policies</th>'+
      '<th class="num">Commission Shared</th><th>Share</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
      '<tfoot><tr><td>Total ('+list.length+' agents)</td>'+
      '<td class="num">'+intf(totCount)+'</td>'+
      '<td class="num">'+omr(totShared)+'</td><td></td></tr></tfoot></table>';
  }

  function insurerTable(list){
    if(!list.length) return '<div class="empty">No insurer records available.</div>';
    var max = list[0].premium || 1, totPrem=0, totCount=0, totComm=0;
    var rows='';
    list.forEach(function(ins){
      totPrem+=ins.premium; totCount+=ins.count; totComm+=ins.commission;
      var avg = ins.premium>0 ? (ins.commission/ins.premium*100) : 0;
      var w = Math.max(2, ins.premium/max*100).toFixed(1)+'%';
      rows += '<tr class="trow"><td class="name">'+esc(ins.name)+'</td>'+
        '<td class="num">'+intf(ins.count)+'</td>'+
        '<td class="num">'+omr(ins.premium)+'</td>'+
        '<td class="num">'+avg.toFixed(1)+'%</td>'+
        '<td class="barcell"><div class="minibar alt"><span data-w="'+w+'"></span></div></td></tr>';
    });
    var totAvg = totPrem>0 ? (totComm/totPrem*100) : 0;
    return '<table><thead><tr>'+
      '<th>Insurer</th><th class="num">Policies</th>'+
      '<th class="num">Total Premium</th><th class="num">Avg Comm %</th><th>Premium share</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
      '<tfoot><tr><td>Total ('+list.length+' insurers)</td>'+
      '<td class="num">'+intf(totCount)+'</td>'+
      '<td class="num">'+omr(totPrem)+'</td>'+
      '<td class="num">'+totAvg.toFixed(1)+'%</td><td></td></tr></tfoot></table>';
  }

  /* ============ Charts ============ */
  function drawCharts(model){
    if(typeof Chart === 'undefined') return;
    Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
    Chart.defaults.color = '#7A6455';
    var animOpt = REDUCE ? false : {duration:700, easing:'easeOutQuart'};

    // Bar
    var bc = el('barChart');
    if(bc){
      new Chart(bc.getContext('2d'),{
        type:'bar',
        data:{
          labels:model.buckets.map(function(b){return b.label;}),
          datasets:[{
            data:model.buckets.map(function(b){return b.total;}),
            backgroundColor:'#B5622A', hoverBackgroundColor:'#6B3A2A',
            borderRadius:6, maxBarThickness:46
          }]
        },
        options:{
          responsive:true, maintainAspectRatio:false, animation:animOpt,
          plugins:{ legend:{display:false},
            tooltip:{ backgroundColor:'#6B3A2A', padding:10, displayColors:false,
              callbacks:{ label:function(c){ return omr(c.parsed.y); } } } },
          scales:{
            x:{ grid:{display:false}, border:{display:false},
                ticks:{font:{size:12}} },
            y:{ beginAtZero:true, border:{display:false},
                grid:{color:'rgba(107,58,42,0.07)'},
                ticks:{ font:{size:11}, maxTicksLimit:5,
                  callback:function(v){ return v>=1000 ? (v/1000).toFixed(0)+'k' : v; } } }
          }
        }
      });
    }

    // Donut
    var dc = el('donutChart');
    if(dc){
      var dData = [model.src.Direct, model.src.Agent];
      var total = dData[0]+dData[1];
      var centerText = {
        id:'centerText',
        afterDraw:function(chart){
          var ctx = chart.ctx, area = chart.chartArea;
          if(!area) return;
          var cx = (area.left+area.right)/2, cy = (area.top+area.bottom)/2;
          ctx.save();
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillStyle='#7A6455';
          ctx.font='600 11px -apple-system,sans-serif';
          ctx.fillText('TOTAL PREMIUM', cx, cy-12);
          ctx.fillStyle='#1C1410';
          ctx.font='600 16px -apple-system,sans-serif';
          var tShort = total>=1000 ? (total/1000).toFixed(1)+'k' : total.toFixed(0);
          ctx.fillText('OMR '+tShort, cx, cy+8);
          ctx.restore();
        }
      };
      new Chart(dc.getContext('2d'),{
        type:'doughnut',
        data:{
          labels:['Direct','Agent'],
          datasets:[{ data:dData,
            backgroundColor:['#6B3A2A','#B5622A'],
            hoverBackgroundColor:['#582f22','#9c5223'],
            borderColor:'#FFFFFF', borderWidth:3, hoverOffset:6 }]
        },
        options:{
          responsive:true, maintainAspectRatio:false, cutout:'66%', animation:animOpt,
          plugins:{
            legend:{ position:'bottom',
              labels:{ usePointStyle:true, pointStyle:'circle', padding:16, font:{size:12} } },
            tooltip:{ backgroundColor:'#6B3A2A', padding:10, displayColors:false,
              callbacks:{ label:function(c){
                var v=c.parsed, pc = total>0?(v/total*100).toFixed(1):'0.0';
                return c.label+': '+omr(v)+' ('+pc+'%)'; } } }
          }
        },
        plugins:[centerText]
      });
    }
  }

  /* ============ Error ============ */
  function showError(code){
    el('content').innerHTML =
      '<div class="errbox"><h2>Unable to load dashboard data</h2>'+
      '<p>Code: '+esc(code)+'. Please refresh, or contact support if this persists.</p></div>';
  }

  /* ============ Boot ============ */
  function boot(){
    try{ skeleton(); }catch(e){}
    fetchAll(function(recs){
      try{ render(compute(recs)); }
      catch(e){ console.error(e); showError('RENDER_ERROR'); }
    }, function(code){
      console.error('getRecords failed', code);
      showError(code);
    });
  }

  if(window.ZOHO && ZOHO.CREATOR && typeof ZOHO.CREATOR.load === 'function'){
    skeleton();
    ZOHO.CREATOR.load().then(boot).catch(function(){ boot(); });
  } else {
    showError('SDK_NOT_LOADED');
  }
})();
</script>
</body>
</html>
